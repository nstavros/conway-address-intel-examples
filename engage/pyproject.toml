[project]
name = "engage"
version = "0.1.0"
description = "Multi-brand social engagement engine: one engine, N brand configs, hard isolation"
requires-python = ">=3.10"
dependencies = ["pyyaml>=6"]

[project.scripts]
engage = "engage.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["engage*"]
