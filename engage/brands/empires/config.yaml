# Empires and Egos — history channels. Goal: raw growth (views, watch time, subs).
brand: empires
priority: high
platforms: [instagram, youtube, tiktok]

listening:
  # youtube.com/@empiresegos — verified 2026-08-19 via the handle's own page.
  # NOTE: @EmpiresandEgos is a DIFFERENT PERSON's channel; never swap these.
  youtube_channel_id: UC9772FnuAXMVabS0gtr6cew

watch:
  # YouTube peer/competitor CHANNELS (display names, not handles) from the
  # 2026-08 research roadmap — competitive awareness only. These never match
  # an Instagram post author, so they don't feed IG scoring; kept for context.
  # accounts:
  #   - {handle: "Majestic Studios", tier: B}
  #   - {handle: "History Time", tier: B}
  #   - {handle: "Kings & Generals", tier: B}
  #   - {handle: "Fall of Civilizations", tier: B}
  #   - {handle: "Historia Civilis", tier: B}
  #   - {handle: "Extra History", tier: B}
  #   - {handle: "ColdFusion", tier: B}
  #   - {handle: "This Is History", tier: B}
  #
  # Instagram engagement targets, verified live 2026-08-19 (follower/following
  # read off each profile). Same-niche: all are AI-generated/illustrated
  # history content, the actual peer group for @empires.and.egos.
  #   A = reciprocal (low follower:following ratio) — engage AND follow.
  #   B = comment venues (broadcasters, ratio 100:1+) — comment only, no follow.
  accounts:
    - {handle: historictalesthroughtime, tier: A}  # 320/1,136 (3.6:1) best reciprocity in the niche
    - {handle: ki_zeitreise, tier: A}               # 76.2K/599 German AI-history creator, cross-collabs with timemap.app
    - {handle: historyaiillustration, tier: B}      # 255K/0 largest same-niche AI-history account
    - {handle: imperiumarchive_, tier: B}           # 87.1K/0 Rome/Byzantium/Templar AI-history
    - {handle: aiwh_atever, tier: B}                # 126K/221 — CAUTION: some posts (e.g. Persia) draw
                                                     #   toxic political comment threads; skip those, engage others
    - {handle: historicalfrontiers, tier: B}        # 42.8K/12 broad AI-history content
    - {handle: historicalobserver, tier: B}         # 48.4K/459 — CAUTION: occasionally posts present-day
                                                     #   geopolitics (e.g. Greece/Turkey); engage only the
                                                     #   pure-history posts, never the political ones
    - {handle: timemap.app, tier: B}                # 4,680/1 "travel through history" reel app
  blocked_accounts:
    # Verified but wrong purpose — do not add to the watch list.
    # acropolis.panorama.athens: an Airbnb rental listing account dressed as
    #   history content (bio: "This view is one booking away", links to
    #   airbnb.com). Its audience is Athens travel bookers, not history fans.
    # georgiekirani: Greek travel/lifestyle influencer, not history content.
    # raydalio: finance, wrong niche entirely.
    []
  keywords:
    - roman empire
    - ancient rome
    - fall of rome
    - byzantine
    - constantinople
    - ottoman
    - bronze age collapse
    - ancient greece
    - sparta
    - alexander the great
    - hannibal
    - julius caesar
    - tulip mania
    - east india company
    - why empires fall
    - history documentary
  hashtags:
    - "#ancienthistory"
    - "#romanempire"
    - "#historytok"
    - "#ancientrome"

voice:
  prompt_dir: prompts
  signature_phrases:
    - "Every empire dies wearing someone else's clothes"
    - "And here's the part nobody tells you"
  reply_angles:
    - "add a concrete, sourced historical detail the post missed — an object, a number, a date"
    - "pose the strongest historically-contested counterpoint as a question that invites argument"

scoring:
  weights: {relevance: 0.25, author_value: 0.05, recency: 0.25, momentum: 0.35, history: 0.10}
  question_multiplier: 1.0
  cooldown_days: 7
  momentum_baseline_per_hour: 200   # history content moves fast when it moves
  half_life_hours: {instagram: 24, tiktok: 8, youtube: 72}

blocks:
  llm_gate: required
  # every factual assertion must trace to provided source material
  claims_require_source: true
  numeric_provenance: true
  regex:
    # monetization line: historical analysis yes, present-day political claims no
    - '\b(Trump|Biden|Harris|MAGA|Democrat|Republican|left-wing|right-wing)\b'
    - '\b(America|the US|the United States) is (collapsing|falling|next)\b'
  topics:
    - historical claims not present in the provided script or source notes
    - present-day political controversy stated as our claim (a question inviting
      comments is allowed; an assertion is not)
    - academic hedging or clickbait lies
    - engagement-bait unrelated to history

cadence:
  instagram: "1 reel/day"
  tiktok: "1/day cross-post"
  youtube: "shorts 2-3/week (Evolution format won the A/B); long-form ~1/month"

rate_limits:
  instagram: {posts_per_day: 2, replies_per_day: 10}
  tiktok: {posts_per_day: 2, replies_per_day: 10}
  youtube: {posts_per_day: 1, replies_per_day: 20}
